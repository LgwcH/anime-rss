    <text x="1156" y="290" fill="#71d0ff" font-size="18" text-anchor="end">8.4 MiB/s</text>
    <rect x="322" y="368" width="912" height="280" rx="20" fill="#202943" stroke="#35405f"/>
    <text x="348" y="410" fill="#f7f8ff" font-size="20" font-weight="700">下载队列</text>
    <line x1="348" y1="438" x2="1208" y2="438" stroke="#35405f"/>
