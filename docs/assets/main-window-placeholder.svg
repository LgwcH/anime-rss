    <rect x="451" y="230" width="75" height="28" rx="14" fill="#244d46"/>
    <text x="470" y="250" fill="#7ee2bd" font-size="13">已启用</text>
    <rect x="344" y="286" width="388" height="8" rx="4" fill="#333c59"/>
    <rect x="344" y="286" width="254" height="8" rx="4" fill="url(#accent)"/>
    <text x="344" y="317" fill="#8f99b8" font-size="13">最新：第 08 集 · 65%</text>
    <rect x="782" y="122" width="452" height="218" rx="20" fill="#202943" stroke="#35405f"/>
    <text x="808" y="164" fill="#f7f8ff" font-size="20" font-weight="700">下载概览</text>
    <text x="808" y="210" fill="#9fa9c6" font-size="15">活动任务</text>
    <text x="1156" y="210" fill="#f7f8ff" font-size="18" text-anchor="end">2</text>
