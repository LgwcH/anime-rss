<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AniRSS 主窗口截图占位图</title>
  <desc id="desc">包含侧栏、订阅卡片和下载队列的界面线框占位图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101728"/>
      <stop offset="1" stop-color="#1d2440"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#5fc4ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <rect x="28" y="28" width="250" height="664" rx="22" fill="#171e33" stroke="#303a59"/>
  <circle cx="72" cy="77" r="20" fill="url(#accent)"/>
  <text x="105" y="87" fill="#f7f8ff" font-family="system-ui, sans-serif" font-size="27" font-weight="700">AniRSS</text>
  <g font-family="system-ui, sans-serif" font-size="18">
