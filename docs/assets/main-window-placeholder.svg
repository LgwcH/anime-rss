  <text x="1081" y="77" fill="#0f1630" font-family="system-ui, sans-serif" font-size="17" font-weight="700">＋ 添加订阅</text>
  <g font-family="system-ui, sans-serif">
    <rect x="322" y="122" width="432" height="218" rx="20" fill="#202943" stroke="#35405f"/>
    <rect x="344" y="146" width="82" height="116" rx="12" fill="#323c5c"/>
    <text x="451" y="174" fill="#f7f8ff" font-size="20" font-weight="700">Example Animation</text>
