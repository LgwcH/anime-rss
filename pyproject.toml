[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "anirss"
version = "0.1.5"
description = "A privacy-friendly Windows RSS subscription and download manager for episodic media."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "AniRSS Contributors" },
]
keywords = ["rss", "desktop", "download-manager", "pyside6", "bittorrent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Multimedia",
]
dependencies = [
  "PySide6>=6.7,<7",
]

[project.optional-dependencies]
# The PyPI distribution is named ``libtorrent`` and exposes the
# ``libtorrent`` Python module (often called python-libtorrent by distros).
# Keeping it optional lets HTTP-only installations work when a matching
# Windows binary wheel is not available.
torrent = [
  "libtorrent>=2.0.11,<3",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "pytest-qt>=4.4,<5",
  "ruff>=0.8,<1",
]
packaging = [
  "pyinstaller>=6.11,<7",
]

[project.scripts]
anirss = "anirss.app:main"

[project.gui-scripts]
anirss-gui = "anirss.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anirss"]

[tool.hatch.build.targets.wheel.force-include]
"resources/icons/anirss.png" = "anirss/resources/icons/anirss.png"

[tool.hatch.build.targets.sdist]
include = [
  "/.gitattributes",
  "/.github",
  "/src",
  "/tests",
  "/docs",
  "/resources",
  "/scripts",
  "/AniRSS.spec",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/QUICKSTART.txt",
  "/README.md",
  "/RELEASE_NOTES-0.1.1.md",
  "/RELEASE_NOTES-0.1.2.md",
  "/RELEASE_NOTES-0.1.3.md",
  "/RELEASE_NOTES-0.1.4.md",
  "/RELEASE_NOTES-0.1.5.md",
  "/SECURITY.md",
  "/THIRD_PARTY_NOTICES.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
qt_api = "pyside6"

[tool.coverage.run]
branch = true
source = ["anirss"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Chinese punctuation is intentional in user-facing copy.
"src/anirss/**/*.py" = ["RUF001"]
# SVG path data and Qt style-sheet literals are more readable as single lines.
"src/anirss/ui/resources.py" = ["E501", "RUF001"]
"src/anirss/ui/theme.py" = ["E501", "RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src/anirss", "tests"]
exclude = ["^build/", "^dist/"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["libtorrent", "libtorrent.*"]
ignore_missing_imports = true
